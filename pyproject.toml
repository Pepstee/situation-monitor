[project]
name = "situation-monitor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["flask", "requests"]

[project.scripts]
edge = "situation_monitor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F"]
